name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    # Fast headless source gates; deep campaigns and graphics are not PR coverage.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Verify headless formatting, fast C#, components and bounded transport
        run: mise run ci-source --startup-timeout-ms 60000
      - name: Retain non-secret timings, test results and bounded engine diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-source-timings-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            logs/*/*-summary.json
            logs/*/*-results/*.trx
            logs/*/**/engine.log
            logs/*/**/*-engine-*.log
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Export Linux roles and verify packages
        # Cold hosted-runner imports can exceed the local 15-second startup default.
        run: mise run ci-linux-package --startup-timeout-ms 60000
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared locked SDK and Godot .NET
        shell: pwsh
        run: mise install --locked dotnet godot-dotnet
      - name: Verify native source, export and standalone offline solo
        shell: pwsh
        # A cold Windows asset import exceeds the local 15-second startup default.
        run: mise run ci-windows --startup-timeout-ms 60000
