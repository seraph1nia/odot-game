name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Provide private-display software graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 openbox
      - name: Verify formatting, build, rules, network and source UI
        run: mise run ci-source --startup-timeout-ms 60000
  linux-package:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Provide private-display software graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 openbox
      - name: Export Linux roles and verify packages
        run: |
          git tag v0.1.0-beta.1
          mise run package-linux --tag v0.1.0-beta.1 --startup-timeout-ms 60000
          mise run ci-linux-package
          mise run verify-installed-linux --tag v0.1.0-beta.1 --startup-timeout-ms 60000
  # Windows packaging is temporarily disabled in ordinary PR/main CI.
  # The published-release workflow remains responsible for Windows artifacts.
