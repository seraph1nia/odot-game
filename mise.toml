[tools]
node = "24"
"npm:@fission-ai/openspec" = "1.13.2"
dotnet = "10"

# The registry's `godot` tool is the standard edition. C# needs .NET/mono.
[tool_alias]
godot-dotnet = "github:godotengine/godot"

[tools.godot-dotnet]
version = "4"
prerelease = false

[tools.godot-dotnet.platforms.linux-x64]
asset_pattern = "Godot_v{{ version }}_mono_linux*x86_64.zip"
strip_components = 1
bin_path = "."
rename_exe = { "Godot_v*_mono_linux*" = "godot" }

[tools.godot-dotnet.platforms.windows-x64]
asset_pattern = "Godot_v{{ version }}_mono_win64.zip"
strip_components = 1
bin_path = "."
rename_exe = { "Godot_v*_mono_win64.exe" = "godot.exe" }

[tools.godot-dotnet.platforms.macos-arm64]
asset_pattern = "Godot_v{{ version }}_mono_macos.universal.zip"
strip_components = 0
bin_path = "Godot_mono.app/Contents/MacOS"
rename_exe = { "Godot" = "godot" }

[tools.godot-dotnet.platforms.macos-x64]
asset_pattern = "Godot_v{{ version }}_mono_macos.universal.zip"
strip_components = 0
bin_path = "Godot_mono.app/Contents/MacOS"
rename_exe = { "Godot" = "godot" }

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "windows-x64", "macos-arm64", "macos-x64"]
task.run_auto_install = false
exec_auto_install = false

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks.runner]
description = "Compile the local development supervisor"
hide = true
run = ["dotnet restore tools/DevRunner/DevRunner.csproj --locked-mode", "dotnet build tools/DevRunner/DevRunner.csproj --no-restore --nologo"]

[tasks.prepare-tests]
description = "Restore locked dependencies and compile shared outputs once before isolated test binaries"
hide = true
run = ["dotnet restore Odot.slnx --locked-mode", "dotnet build Odot.slnx --no-restore --nologo"]

[tasks.test]
description = "Default fast C# tests; no Godot processes, excludes deep campaigns"
depends = ["prepare-tests"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-fast"
raw_args = true

[tasks.test-fast]
description = "Fast C# core and runner binaries; --filter uses standard .NET syntax; --jobs 1 for serial debug"
depends = ["prepare-tests"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-fast"
raw_args = true

[tasks.test-core]
description = "Fast Game.Core tests only; --filter FullyQualifiedName~ClassOrMethod"
depends = ["prepare-tests"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-core"
raw_args = true

[tasks.test-runner]
description = "Runner/unit integration boundaries only; --filter FullyQualifiedName~ClassOrMethod"
depends = ["prepare-tests"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-runner"
raw_args = true

[tasks.test-campaign]
description = "Explicit deep C# twenty-wave campaign matrix; --filter supported"
depends = ["prepare-tests"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-campaign"
raw_args = true

[tasks.test-engine]
description = "Focused owned HEADLESS production components; settings includes UI resources/input/services; --scenario settings|animation|assets"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-engine"
raw_args = true

[tasks.test-deep]
description = "Explicit deep C# campaigns and headless multiplayer journeys; no graphical processes"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-deep"
raw_args = true

[tasks.test-in-process]
description = "Explicit all-C# socketless fallback, including deep tests; no filtering"
run = ["dotnet restore tests/Game.Core.Tests/Game.Core.Tests.csproj --locked-mode", "dotnet restore tests/DevRunner.Tests/DevRunner.Tests.csproj --locked-mode", "dotnet build tests/Game.Core.Tests/Game.Core.Tests.csproj --no-restore -m:1 -nr:false -p:UseSharedCompilation=false", "dotnet build tests/DevRunner.Tests/DevRunner.Tests.csproj --no-restore -m:1 -nr:false -p:UseSharedCompilation=false", "dotnet tests/Game.Core.Tests/bin/Debug/net10.0/Game.Core.Tests.dll", "dotnet tests/DevRunner.Tests/bin/Debug/net10.0/DevRunner.Tests.dll"]

[tasks.profile-campaign]
description = "Profile one bounded campaign with separate warm-up and runtime/harness metrics"
run = "sh .mise/profile-core profile-campaign"
raw_args = true

[tasks.test-scale]
description = "Run the selected synthetic 2,048-actor fight for 600 ordinary ticks"
run = "sh .mise/profile-core test-scale"
raw_args = true

[tasks.profile-scale]
description = "Profile selected synthetic fight sizes with separate warm-up and stepping"
run = "sh .mise/profile-core profile-scale"
raw_args = true

[tasks.profile-snapshots]
description = "Profile detached projections and fixed-input JSON/Brotli codec phases"
run = "sh .mise/profile-core profile-snapshots"
raw_args = true

[tasks.dev]
description = "Start a playable host and one guest window (--guests 1..3)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll dev"
raw_args = true

[tasks.server]
description = "Start the headless server (defaults to loopback:7000)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll server"
raw_args = true

[tasks.play]
description = "Open the start screen (solo, Steam multiplayer, settings and exit)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll play"
raw_args = true

[tasks.client]
description = "Connect a graphical client to a server"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll client"
raw_args = true

[tasks.prepare]
description = "Check tools, compile C#, and import Godot resources"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll prepare"

[tasks.build]
description = "Compile the solution without exporting deliverables"
run = ["dotnet restore Odot.slnx --locked-mode", "dotnet build Odot.slnx --no-restore --nologo"]

[tasks.check]
description = "Verify C# formatting without modifying source"
run = ["dotnet restore Odot.slnx --locked-mode", "dotnet format Odot.slnx --verify-no-changes --no-restore"]

[tasks.test-assets]
description = "Verify authored static rendering buffers and corruption regressions in one owned headless engine"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-assets"
raw_args = true

[tasks.test-native-pump]
description = "Bounded owned native reliable peer/pump conservation control; no graphical game acceptance"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-native-pump"
raw_args = true

[tasks.test-network]
description = "Bounded headless lifecycle/failure transport by default; --scenario selects a single journey"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-network"
raw_args = true

[tasks.test-ui]
description = "Explicit graphical acceptance ONLY (not headless/default CI); --scenario required"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-ui"
raw_args = true

[tasks.test-atmosphere]
description = "Capture eight deterministic atmospheric views on owned Compatibility graphics (--exported uses existing packages)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-atmosphere"
raw_args = true

[tasks.test-vulkan]
description = "Optional owned native Forward+/Vulkan hardware smoke and eight visual captures; never mandatory software CI"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-vulkan"
raw_args = true

[tasks.check-ui-prerequisites]
description = "Check private-display executable prerequisites without launching Godot"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll check-ui-prerequisites"

[tasks.prepare-templates]
description = "Download and verify matching .NET export templates"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll prepare-templates"

[tasks.export-client]
description = "Export the Linux x86_64 desktop client"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll export-client"
raw_args = true

[tasks.check-steam-extension]
description = "Check pinned native Steam/C# lifecycle (single account; not multiplayer acceptance)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll check-steam-extension"
raw_args = true

[tasks.export-server]
description = "Export the Linux x86_64 dedicated server"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll export-server"

[tasks.test-steam]
description = "Run one side of paired Steam verification (two machines/accounts, normal desktop)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-steam"
raw_args = true

[tasks.ci]
description = "Headless source and Linux exports/package gates; no deep campaigns or graphical qualification"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll ci"
raw_args = true

[tasks.ci-windows]
description = "Verify native Windows Steam/runtime exports and bounded offline solo (no publishing)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll ci-windows"
raw_args = true

[tasks.ci-source]
description = "Headless formatting/build/fast C#/component/essential transport gates; no exports or graphics"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll ci-source"
raw_args = true

[tasks.ci-linux-package]
description = "Prepare/export/check Linux packages headlessly; source gates are separate"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll ci-linux-package"
raw_args = true

[tasks.package-linux]
description = "Build versioned Linux archive and installer from an exact clean tag"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll package-linux"
raw_args = true

[tasks.package-windows]
description = "Build versioned Windows installer from an exact clean tag (requires ISCC_PATH)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll package-windows"
raw_args = true

[tasks.verify-installed-linux]
description = "Install and verify existing Linux release assets without rebuilding"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll verify-installed-linux"
raw_args = true

[tasks.verify-installed-windows]
description = "Install, upgrade, run and uninstall an existing Windows release installer"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll verify-installed-windows"
raw_args = true

[tasks.release-preflight]
description = "Validate an exact clean release tag and packaging identity without building"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll release-preflight"
raw_args = true

[tasks.assemble-release-assets]
description = "Validate and assemble the allowlisted public release assets"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll assemble-release-assets"
raw_args = true

[tasks.profile-presentation]
description = "Profile the selected 600-frame playback on an owned software-rendered display"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll profile-presentation"
raw_args = true
