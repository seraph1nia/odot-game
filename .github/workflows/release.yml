name: Build published release

on:
  release:
    types: [published]
  # Exercise package transfer and assembly without touching a public release.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'tools/Distribution/**'
      - 'tools/DevRunner/Release*.cs'
      - 'tools/DevRunner/TaggedExports.cs'
      - 'tests/DevRunner.Tests/*Packaging*'
      - 'tests/DevRunner.Tests/*Release*'
      - 'tests/DevRunner.Tests/WorkflowPolicyTests.cs'

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || format('v0.0.0-ci.{0}', github.run_id) }}
  INNO_VERSION: 6.7.3
  INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create local qualification tag (never pushed)
        if: github.event_name == 'pull_request'
        run: git tag "$TAG"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tool
        run: mise install --locked dotnet
      - name: Validate qualification tag
        if: github.event_name == 'pull_request'
        run: mise run release-preflight --tag "$TAG" --target linux-x64
      - name: Validate public release and exact tag
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          STEAM_APP_ID: ${{ vars.ODOT_STEAM_APP_ID }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false || { echo 'Repository must be public before distribution.' >&2; exit 1; }
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" = 0 || { echo 'Release already has assets; published versions are never overwritten.' >&2; exit 1; }
          args=(--tag "$TAG" --target linux-x64)
          precedence=${TAG%%+*}
          if [[ "$precedence" != *-* ]]; then
            test -n "$STEAM_APP_ID" || { echo 'Stable releases require repository variable ODOT_STEAM_APP_ID.' >&2; exit 1; }
            args+=(--steam-app-id "$STEAM_APP_ID")
          fi
          mise run release-preflight "${args[@]}"
          preview=false; [[ "$precedence" == *-* ]] && preview=true
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = "$preview" || { echo 'GitHub prerelease flag must agree with the SemVer tag.' >&2; exit 1; }
  linux-package:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create local qualification tag (never pushed)
        if: github.event_name == 'pull_request'
        run: git tag "$TAG"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Build Linux package
        env:
          STEAM_APP_ID: ${{ vars.ODOT_STEAM_APP_ID }}
        run: |
          args=(--tag "$TAG")
          precedence=${TAG%%+*}
          if [[ "$precedence" != *-* ]]; then args+=(--steam-app-id "$STEAM_APP_ID"); fi
          mise run package-linux "${args[@]}" --startup-timeout-ms 60000
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/releases/${{ env.VERSION }}/odot-${{ env.VERSION }}-linux-x64.tar.gz
            dist/releases/${{ env.VERSION }}/odot-${{ env.VERSION }}-linux-x64-install.sh
            dist/releases/${{ env.VERSION }}/build-info.linux-x64.json
            dist/releases/${{ env.VERSION }}/SHA256SUMS.linux-x64

  windows-package:
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create local qualification tag (never pushed)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: git tag "$env:TAG"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared SDK and Godot .NET
        shell: pwsh
        run: mise install --locked dotnet godot-dotnet
      - name: Acquire checksum-pinned Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch: $actual" }
          $directory = Join-Path $env:RUNNER_TEMP "inno"
          $process = Start-Process -Wait -PassThru $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$directory"
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          "ISCC_PATH=$(Join-Path $directory 'ISCC.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build Windows package
        shell: pwsh
        env:
          STEAM_APP_ID: ${{ vars.ODOT_STEAM_APP_ID }}
        run: |
          $arguments = @("--tag", $env:TAG)
          if (-not $env:TAG.Split('+')[0].Contains("-")) { $arguments += @("--steam-app-id", $env:STEAM_APP_ID) }
          mise run package-windows @arguments --startup-timeout-ms 60000
          "VERSION=$($env:TAG.Substring(1))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/releases/${{ env.VERSION }}/odot-${{ env.VERSION }}-windows-x64-setup.exe
            dist/releases/${{ env.VERSION }}/build-info.windows-x64.json
            dist/releases/${{ env.VERSION }}/SHA256SUMS.windows-x64

  publish-assets:
    # PR runs verify the exact same transfer set, but cannot attach release assets.
    needs: [linux-package, windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create local qualification tag (never pushed)
        if: github.event_name == 'pull_request'
        run: git tag "$TAG"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tool
        run: mise install --locked dotnet
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release-assets'
          path: assets
          merge-multiple: true
      - name: Validate and assemble public metadata and checksums
        env:
          STEAM_APP_ID: ${{ vars.ODOT_STEAM_APP_ID }}
        run: |
          args=(--tag "$TAG")
          precedence=${TAG%%+*}
          if [[ "$precedence" != *-* ]]; then args+=(--steam-app-id "$STEAM_APP_ID"); fi
          mise run assemble-release-assets "${args[@]}"
      - name: Verify final public checksums
        run: cd assets && sha256sum --check --strict SHA256SUMS
      - name: Attach verified bytes to the existing published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY"
