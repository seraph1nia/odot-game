name: Verify and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Provide private-display software graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 openbox
      - name: Verify formatting, build, rules, network and source UI
        run: mise run ci-source
  linux-package:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Provide private-display software graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 openbox
      - name: Export Linux roles and verify packages
        run: mise run ci-linux-package
  windows-package:
    needs: source
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared locked SDK and Godot .NET
        shell: pwsh
        run: mise install --locked dotnet godot-dotnet
      - name: Verify native source, export and standalone offline solo
        shell: pwsh
        # A cold Windows asset import exceeds the local 15-second startup default.
        run: mise run ci-windows --startup-timeout-ms 60000
