[tools]
node = "24"
"npm:@fission-ai/openspec" = "1.13.2"
dotnet = "10"

# The registry's `godot` tool is the standard edition. C# needs .NET/mono.
[tool_alias]
godot-dotnet = "github:godotengine/godot"

[tools.godot-dotnet]
version = "4"
prerelease = false

[tools.godot-dotnet.platforms.linux-x64]
asset_pattern = "Godot_v{{ version }}_mono_linux*x86_64.zip"
strip_components = 1
bin_path = "."
rename_exe = { "Godot_v*_mono_linux*" = "godot" }

[tools.godot-dotnet.platforms.windows-x64]
asset_pattern = "Godot_v{{ version }}_mono_win64.zip"
strip_components = 1
bin_path = "."
rename_exe = { "Godot_v*_mono_win64.exe" = "godot.exe" }

[tools.godot-dotnet.platforms.macos-arm64]
asset_pattern = "Godot_v{{ version }}_mono_macos.universal.zip"
strip_components = 0
bin_path = "Godot_mono.app/Contents/MacOS"
rename_exe = { "Godot" = "godot" }

[tools.godot-dotnet.platforms.macos-x64]
asset_pattern = "Godot_v{{ version }}_mono_macos.universal.zip"
strip_components = 0
bin_path = "Godot_mono.app/Contents/MacOS"
rename_exe = { "Godot" = "godot" }

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "windows-x64", "macos-arm64", "macos-x64"]
task.run_auto_install = false

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks.runner]
description = "Compile the local development supervisor"
hide = true
run = ["dotnet restore tools/DevRunner/DevRunner.csproj --locked-mode", "dotnet build tools/DevRunner/DevRunner.csproj --no-restore --nologo"]

[tasks.test]
description = "Run cheap gameplay and runner xUnit checks without Godot"
run = ["dotnet restore tests/Game.Core.Tests/Game.Core.Tests.csproj --locked-mode", "dotnet restore tests/DevRunner.Tests/DevRunner.Tests.csproj --locked-mode", "dotnet test tests/Game.Core.Tests/Game.Core.Tests.csproj --no-restore --nologo", "dotnet test tests/DevRunner.Tests/DevRunner.Tests.csproj --no-restore --nologo"]

[tasks.dev]
description = "Start a playable host and one guest window (--guests 1..3)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll dev"
raw_args = true

[tasks.server]
description = "Start the headless server (defaults to loopback:7000)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll server"
raw_args = true

[tasks.play]
description = "Open the start screen (solo, Steam multiplayer, settings and exit)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll play"
raw_args = true

[tasks.client]
description = "Connect a graphical client to a server"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll client"
raw_args = true

[tasks.prepare]
description = "Check tools, compile C#, and import Godot resources"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll prepare"

[tasks.build]
description = "Compile the solution without exporting deliverables"
run = ["dotnet restore Odot.slnx --locked-mode", "dotnet build Odot.slnx --no-restore --nologo"]

[tasks.check]
description = "Verify C# formatting without modifying source"
run = ["dotnet restore Odot.slnx --locked-mode", "dotnet format Odot.slnx --verify-no-changes --no-restore"]

[tasks.test-network]
description = "Verify real server/client processes without a display"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-network"
raw_args = true

[tasks.test-ui]
description = "Run named graphical checks on an owned private Linux display"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-ui"
raw_args = true

[tasks.check-ui-prerequisites]
description = "Check private-display executable prerequisites without launching Godot"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll check-ui-prerequisites"

[tasks.prepare-templates]
description = "Download and verify matching .NET export templates"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll prepare-templates"

[tasks.export-client]
description = "Export the Linux x86_64 desktop client"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll export-client"
raw_args = true

[tasks.check-steam-extension]
description = "Check pinned native Steam/C# lifecycle (single account; not multiplayer acceptance)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll check-steam-extension"
raw_args = true

[tasks.export-server]
description = "Export the Linux x86_64 dedicated server"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll export-server"

[tasks.test-steam]
description = "Run one side of paired Steam verification (two machines/accounts, normal desktop)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll test-steam"
raw_args = true

[tasks.ci]
description = "Verify rules/network/private UI, export Linux roles and check packages"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll ci"

[tasks.ci-windows]
description = "Verify native Windows Steam/runtime exports and bounded offline solo (no publishing)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll ci-windows"
raw_args = true

[tasks.ci-source]
description = "Run all formatting/build/rules/network/source UI gates without exports"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll ci-source"
raw_args = true

[tasks.ci-linux-package]
description = "Prepare/export/check Linux packages (workflow requires source gate first)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll ci-linux-package"
raw_args = true

[tasks.package-linux]
description = "Build versioned Linux archive and installer from an exact clean tag"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll package-linux"
raw_args = true

[tasks.package-windows]
description = "Build versioned Windows installer from an exact clean tag (requires ISCC_PATH)"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll package-windows"
raw_args = true

[tasks.verify-installed-linux]
description = "Install and verify existing Linux release assets without rebuilding"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll verify-installed-linux"
raw_args = true

[tasks.verify-installed-windows]
description = "Install, upgrade, run and uninstall an existing Windows release installer"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll verify-installed-windows"
raw_args = true

[tasks.release-preflight]
description = "Validate an exact clean release tag and packaging identity without building"
depends = ["runner"]
run = "dotnet tools/DevRunner/bin/Debug/net10.0/DevRunner.dll release-preflight"
raw_args = true
