name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    # Allow aggregate serial preparation, verification and cleanup; worker bounds are separate.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Provide private-display software graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 openbox
      - name: Verify formatting, build, rules, network and source UI
        # Cold imports need startup headroom; use the supported two-display admission.
        run: mise run ci-source --startup-timeout-ms 60000 --ui-jobs 2
      - name: Retain synthetic combat pose failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (same pin as release)
        with:
          name: combat-pose-failure-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          # Failure-only bounded staging; never upload raw logs or runtime data.
          path: |
            logs/*/combat-worker/combat/pose-failure/manifest.json
            logs/*/combat-worker/combat/pose-failure/combat-pose-proof.json
            logs/*/combat-worker/combat/pose-failure/ui-client.states.json
            logs/*/combat-worker/combat/pose-failure/ui-observer.states.json
            logs/*/combat-worker/combat/pose-failure/ui-server.states.json
            logs/*/combat-worker/combat/pose-failure/combat-casualty-admission.json
            logs/*/combat-worker/combat/pose-failure/combat-casualty-pause.json
            logs/*/combat-worker/combat/pose-failure/combat-death-cleanup.json
            logs/*/combat-worker/combat/pose-failure/combat-catapult-observation.json
            logs/*/combat-worker/combat/pose-failure/combat-catapult.png
            logs/*/combat-worker/combat/pose-failure/combat-locomotion-observation.json
            logs/*/combat-worker/combat/pose-failure/combat-locomotion.png
            logs/*/combat-worker/combat/pose-failure/combat-unit-inspection-observation.json
            logs/*/combat-worker/combat/pose-failure/combat-unit-inspection.png
            logs/*/combat-worker/combat/pose-failure/combat-paused-observation.json
            logs/*/combat-worker/combat/pose-failure/combat-paused.png
            logs/*/combat-worker/combat/pose-failure/combat-camera-paused-observation.json
            logs/*/combat-worker/combat/pose-failure/combat-camera-paused.png
            logs/*/combat-worker/combat/pose-failure/combat-unit-inspection-resized-observation.json
            logs/*/combat-worker/combat/pose-failure/combat-unit-inspection-resized.png
            logs/*/combat-worker/combat/pose-failure/combat-resized-observation.json
            logs/*/combat-worker/combat/pose-failure/combat-resized.png
            logs/*/combat-worker/combat/pose-failure/combat-casualty-observation.json
            logs/*/combat-worker/combat/pose-failure/combat-casualty.png
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared tools
        run: mise install --locked dotnet godot-dotnet
      - name: Provide private-display software graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 openbox
      - name: Export Linux roles and verify packages
        # Cold hosted-runner imports can exceed the local 15-second startup default.
        run: mise run ci-linux-package --startup-timeout-ms 60000
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          install: false
          cache: true
      - name: Install declared locked SDK and Godot .NET
        shell: pwsh
        run: mise install --locked dotnet godot-dotnet
      - name: Verify native source, export and standalone offline solo
        shell: pwsh
        # A cold Windows asset import exceeds the local 15-second startup default.
        run: mise run ci-windows --startup-timeout-ms 60000
